      exec:
        - service frr start
        - sysctl -p
        - vtysh -c 'configure terminal' -f /etc/frr/zebra.conf
        - ip link set dev eth1 address 02:00:00:00:02:aa
        - ip link set eth1 up
        - ip link set eth2 up
        - ip -6 addr add fd00:0:4::1/127 dev eth2
        - ip -6 addr add fd00:0:1::1/64 dev eth1
        - ip -6 route add fd00:0:2::0/64 via fd00:0:4::0

    ixia-c:
      kind: keysight_ixia-c-one
      image: ghcr.io/open-traffic-generator/ixia-c-one:1.28.0-6
      ports:
        - 8443:8443


