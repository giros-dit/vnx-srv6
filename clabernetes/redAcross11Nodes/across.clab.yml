    # ==================== ENLACES MULTUS (COMENTADOS) ====================
    # Para usar Multus: descomentar este bloque y comentar el bloque punto a punto
    #
    # # Core network links (router-to-router)
    - endpoints: ["r1:eth1", "multus:net1001"]  # r1-r2
    - endpoints: ["r2:eth1", "multus:net1001"]
    - endpoints: ["r1:eth2", "multus:net1002"]  # r1-r3
    - endpoints: ["r3:eth1", "multus:net1002"]
    - endpoints: ["r1:eth3", "multus:net1003"]  # r1-r4
    - endpoints: ["r4:eth1", "multus:net1003"]
    - endpoints: ["r1:eth4", "multus:net1004"]  # r1-r7
    - endpoints: ["r7:eth1", "multus:net1004"]
    - endpoints: ["r2:eth2", "multus:net1005"]  # r2-r3
    - endpoints: ["r3:eth2", "multus:net1005"]
    - endpoints: ["r2:eth3", "multus:net1006"]  # r2-r4
    - endpoints: ["r4:eth2", "multus:net1006"]
    - endpoints: ["r2:eth4", "multus:net1007"]  # r2-r6
    - endpoints: ["r6:eth1", "multus:net1007"]
    - endpoints: ["r3:eth3", "multus:net1008"]  # r3-r7
    - endpoints: ["r7:eth2", "multus:net1008"]
    - endpoints: ["r3:eth4", "multus:net1009"]  # r3-r9
    - endpoints: ["r9:eth1", "multus:net1009"]
    - endpoints: ["r4:eth3", "multus:net1010"]  # r4-r5
    - endpoints: ["r5:eth1", "multus:net1010"]
    - endpoints: ["r5:eth2", "multus:net1011"]  # r5-r6
    - endpoints: ["r6:eth2", "multus:net1011"]
    - endpoints: ["r5:eth3", "multus:net1012"]  # r5-r10
    - endpoints: ["r10:eth1", "multus:net1012"]
    - endpoints: ["r6:eth3", "multus:net1013"]  # r6-r10
    - endpoints: ["r10:eth2", "multus:net1013"]
    - endpoints: ["r7:eth3", "multus:net1014"]  # r7-r8
    - endpoints: ["r8:eth1", "multus:net1014"]
    - endpoints: ["r8:eth2", "multus:net1015"]  # r8-r9
    - endpoints: ["r9:eth2", "multus:net1015"]
    - endpoints: ["r8:eth3", "multus:net1016"]  # r8-r11
    - endpoints: ["r11:eth1", "multus:net1016"]
    - endpoints: ["r9:eth3", "multus:net1017"]  # r9-r11
    - endpoints: ["r11:eth2", "multus:net1017"]
    #
    # # Edge network links (router-to-gateway)
    - endpoints: ["r10:eth3", "multus:net2001"]  # r10-rgnb
    - endpoints: ["rgnb:eth2", "multus:net2001"]
    - endpoints: ["r11:eth3", "multus:net2002"]  # r11-rupf
    - endpoints: ["rupf:eth2", "multus:net2002"]
    #
    # # User network links (gateway-to-ixia)
    - endpoints: ["rupf:eth1", "multus:net2003"]  # UPF network
    - endpoints: ["ixia-c:eth1", "multus:net2003"]
    - endpoints: ["rgnb:eth1", "multus:net2004"]  # gNB network
    - endpoints: ["ixia-c:eth2", "multus:net2004"]
