        - ip link set eth2 up
        - ip -6 addr add fd00:0:5::1/127 dev eth2
        - ip -6 addr add fd00:0:2::1/64 dev eth1
        - ip -6 addr add fd00:1:2::1/64 dev eth1
        - ip -6 route add fd00:0:1::2/64 via fd00:0:5::0
        # - ip -6 route add fd00:0:2::/64 via fd00:1:2::b1 metric 10

    rupf:
      kind: linux
